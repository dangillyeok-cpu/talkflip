<style>
  :root{
    --bg:#0d0d10; --s1:#16161b; --s2:#1b1b21; --s3:#202028;
    --text:#f4f4f2; --muted:#8a8a94; --line:rgba(255,255,255,0.08);
    --accent:#d6ff3c; --ink:#0d0d10;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  a{color:var(--accent)}
  #app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) 20px calc(var(--sab) + 18px);max-width:480px;margin:0 auto;position:relative}

  .top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .icon-btn{width:44px;height:44px;border-radius:22px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:active{transform:scale(.94)}
  .chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:13px;font-weight:700}
  .chip .n{opacity:.7;font-weight:500}
  .prog{font-size:13px;color:var(--muted);font-weight:500;margin-left:8px;white-space:nowrap}
  .top>div{display:flex;align-items:center;flex:0 0 auto;white-space:nowrap}

  /* card stage */
  .stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:14px}
  .stack{position:relative;width:100%;max-width:350px;height:100%;max-height:430px}
  /* vote screen: card hugs the top and grows to meet the name grid (28px = room for the two peeking back cards) */
  .stage.vote{align-items:flex-start}
  .stage.vote .stack{aspect-ratio:auto;width:100%;max-width:350px;height:calc(100% - 16px);max-height:430px;min-height:180px}
  .stage.vote{justify-content:center}
  /* vote screen: card + names + buttons sit as one block, centered; leftover space splits top/bottom */
  #app.votemode .stage{flex:0 1 auto;height:446px;min-height:200px;margin-top:auto}
  #app.votemode .names{margin-bottom:auto}   /* hint stays pinned at the bottom like every other card */
  .card{position:absolute;inset:0;border-radius:28px;background:var(--s3);padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px rgba(0,0,0,.5);will-change:transform;touch-action:none}
  .card.back1{background:var(--s2);transform:translateY(14px) scale(.96);box-shadow:none}
  .card.back2{background:var(--s1);transform:translateY(28px) scale(.92);box-shadow:none}
  .card.leaving{transition:transform .32s cubic-bezier(.2,.7,.2,1),opacity .32s;transform:translateY(-120%) rotate(-4deg);opacity:0}
  .card.enter{animation:enter .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes enter{from{transform:translateY(14px) scale(.96)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.card.leaving,.card.enter{transition:none;animation:none}}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  .q{font-size:clamp(26px,7.4vw,34px);line-height:1.3;font-weight:900;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
  .foot{font-size:14px;color:var(--muted);font-weight:500;min-height:20px}
  .foot.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .foot.row span{flex:1 1 auto;min-width:0;word-break:keep-all;text-wrap:balance}
  .foot .inl{flex:0 0 auto;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:13px;font-weight:900}
  .ab{display:flex;gap:10px;align-items:stretch}
  .ab.col{flex-direction:column}
  .ab button{position:relative;flex:1 1 0;min-height:56px;padding:12px 14px;border-radius:16px;background:var(--s2);border:2px solid var(--line);font-size:16px;font-weight:700;line-height:1.3;color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
  .ab.col button{flex:0 0 auto;min-height:52px;font-size:15px;padding:12px 44px}
  .ab button small{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--s3);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--muted)}
  .ab.col button small{top:50%;right:12px;transform:translateY(-50%)}
  /* couple: who picked this side, shown under the option text instead of as a corner badge */
  .ab button.who{flex-direction:column;gap:4px}
  .ab button.who small{position:static;transform:none;height:22px}
  .ab button.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .ab button.on small{background:rgba(13,13,16,.16);color:var(--ink)}

  /* vote grid */
  .names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:350px;margin:0 auto;flex:0 0 auto}
  .names.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .name{height:64px;border-radius:18px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:18px;font-weight:900;transition:transform .12s}
  .name small{font-size:12px;font-weight:500;color:var(--muted)}
  .name.on{background:var(--accent);color:var(--ink);transform:scale(1.03)}
  .name.on small{color:var(--ink);font-weight:700}
  .name:active{transform:scale(.96)}

  .bottom{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
  .hint{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:13px;height:56px;justify-content:center;width:100%}
  .cta{width:100%;height:56px;border-radius:18px;background:var(--text);color:var(--ink);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
  .cta.ghost{background:none;color:var(--muted);height:44px;font-weight:700;font-size:15px}
  .cta:active{transform:scale(.98)}
  .inl:disabled{background:var(--s2);color:var(--muted);opacity:.6;pointer-events:none}

  /* penalty roulette */
  .roul{min-height:150px;border-radius:22px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:6px 0 14px;font-size:clamp(20px,5.6vw,24px);font-weight:900;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
  .roul small{display:block;font-size:14px;font-weight:700;opacity:.7;margin-top:8px;text-wrap:balance}
  .roul.spin{color:var(--muted)}
  .roul.hit{background:var(--accent);color:var(--ink);animation:hit .4s cubic-bezier(.2,.7,.2,1)}
  @keyframes hit{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
  @media (prefers-reduced-motion:reduce){.roul.hit{animation:none}}

  /* result */
  .result{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:6px}
  .rcard{width:100%;max-width:350px;aspect-ratio:350/500;max-height:100%;border-radius:28px;background:var(--accent);color:var(--ink);padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px color-mix(in srgb,var(--accent) 22%,transparent)}
  .rcard .meta{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.7}
  .rcard .title{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:clamp(44px,13vw,58px);line-height:1.02;margin-top:6px;word-break:keep-all}
  .rcard .who{font-size:clamp(34px,10vw,44px);font-weight:900;line-height:1.1}
  .rcard .sub{font-size:14px;font-weight:700;opacity:.75;margin-top:4px}
  .rcard .list{border-top:2px solid rgba(13,13,16,.18);padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .rcard .list div{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
  .rcard .brand{display:flex;justify-content:space-between;font-size:12px;font-weight:700;opacity:.6}
  .rcard .pct{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:120px;line-height:.9}
  .rcard .pct span{font-size:44px}
  .charslot{width:88px;height:88px;border-radius:24px;background:rgba(13,13,16,.14);display:none}

  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-width:480px;background:var(--s1);border-radius:28px 28px 0 0;padding:14px 20px calc(var(--sab) + 22px);animation:up .26s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .sheet h2{font-size:22px;font-weight:900;margin:0 0 6px}
  .sheet p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .sheet label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px}
  .field{display:flex;gap:8px;margin-bottom:8px}
  .field input{flex:1;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--s2);color:var(--text);font:inherit;font-size:17px;font-weight:700;padding:0 16px}
  .field input::placeholder{color:#55555f;font-weight:500}
  .field button{width:52px;height:52px;border-radius:14px;background:var(--s2);color:var(--muted);font-size:22px}
  .decks{display:flex;flex-wrap:wrap;gap:8px}
  .deck{height:44px;padding:0 16px;border-radius:999px;background:var(--s2);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .deck i{width:10px;height:10px;border-radius:5px;display:inline-block}
  .deck.on{outline:2px solid var(--text)}
  .row{display:flex;gap:8px}
  .seg{flex:1;height:44px;border-radius:14px;background:var(--s2);font-size:14px;font-weight:700}
  .seg.on{background:var(--text);color:var(--ink)}
  .links{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:13px}
  .links a{color:var(--muted);text-decoration:none}

  /* share modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:30;padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 16px)}
  .modal{width:100%;max-width:420px;max-height:100%;background:var(--s1);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
  /* preview is 1080x1600: cap its height so the modal (image + two buttons) always fits the screen */
  .modal img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 220px);max-height:calc(100dvh - 220px);margin:0 auto;border-radius:16px}
  .coach{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 66px);background:var(--text);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;z-index:15;animation:fade .2s;pointer-events:none}
  .coach::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;background:var(--text);transform:translateX(-50%) rotate(45deg);border-radius:2px}
  .toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:40}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const t = () => STR[state.lang];
const L = obj => obj[state.lang] || obj.ko;

/* ===================== state ===================== */
const state = {
  lang: (() => { let l = null; try { l = localStorage.getItem(KEY.lang); } catch(e){} if(l === "ko" || l === "en") return l; return (navigator.language||"ko").toLowerCase().startsWith("ko") ? "ko" : "en"; })(),
  // ?deck=spicy (from /decks/*.html) wins over the saved deck; the param is then dropped from the URL
  deckId: (() => {
    try { const q = new URLSearchParams(location.search).get("deck"); if(q && DECK[q]){ history.replaceState(null, "", location.pathname); return q; } } catch(e){}
    try { return DECK[localStorage.getItem(KEY.deck)] ? localStorage.getItem(KEY.deck) : "party"; } catch(e){ return "party"; }
  })(),
  players: (() => { try { return JSON.parse(localStorage.getItem(KEY.players) || "[]"); } catch(e){ return []; } })(),
  screen: "card",        // card | result
  round: [],             // cards in this round
  idx: 0,
  votes: {},             // cardId -> { name: count }
  picks: {},             // cardId -> [choiceIndexP1, choiceIndexP2]  (couple)
  soloPicks: {},         // cardId -> choiceIndex (solo choice)
  abVotes: {},           // cardId -> [countA, countB]  (group choice, one tap per hand)
  namesAsked: false,
  seen: (() => { try { return JSON.parse(localStorage.getItem("tf2.seen") || "{}"); } catch(e){ return {}; } })(),   // deck:pool -> [cardId] dealt so far
  stats: {},             // cardId -> {a,b,n,pa,pb} from the stats API (prefetched per round)
  sent: {}               // cardId -> true once this phone's answer was posted
};
function save(){ try { localStorage.setItem(KEY.players, JSON.stringify(state.players)); localStorage.setItem(KEY.deck, state.deckId); localStorage.setItem(KEY.lang, state.lang); } catch(e){} }

const mode = () => DECK[state.deckId].players === 2 || state.players.length === 2 ? "couple" : state.players.length >= 3 ? "group" : "solo";

/* ===================== round building ===================== */
// No repeats until a pool is used up: cards already dealt are remembered per deck+pool (localStorage),
// unseen ones are dealt first, and once a pool runs dry a new cycle starts with the leftovers.
function loadSeen(){ try { return JSON.parse(localStorage.getItem(KEY.seen) || "{}"); } catch(e){ return {}; } }
function saveSeen(){ try { localStorage.setItem(KEY.seen, JSON.stringify(state.seen)); } catch(e){} }
function takeFresh(pool, n, key){
  const seen = new Set(state.seen[key] || []);
  const fresh = shuffle(pool.filter(c => !seen.has(c.id)));
  let out = fresh.slice(0, n);
  if(out.length < n){
    const rest = shuffle(pool.filter(c => seen.has(c.id))).slice(0, n - out.length);
    out = out.concat(rest);
    state.seen[key] = rest.map(c => c.id);              // pool exhausted: new cycle starts with what we just reused
  } else {
    state.seen[key] = [...seen, ...out.map(c => c.id)];
  }
  return out;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildRound(){
  const deck = state.deckId;
  const inDeck = CARDS.filter(c => c.deck === deck);
  // no names yet on a group deck: build a group round anyway; names are asked at the first vote card
  const m = (state.players.length === 0 && !DECK[deck].players) ? "group" : mode();
  let picked = [];
  if(m === "group"){
    let votes = inDeck.filter(c => c.cardType === "vote");
    if(votes.length < VOTE_PER_ROUND) votes = votes.concat(CARDS.filter(c => c.cardType === "vote" && ["party","funny"].includes(c.deck)));
    const others = inDeck.filter(c => c.cardType !== "vote");
    picked = takeFresh(votes, VOTE_PER_ROUND, deck + ":vote").concat(takeFresh(others, ROUND_SIZE - VOTE_PER_ROUND, deck + ":other"));
    picked = shuffle(picked);
    // never start with a vote card twice in a row? keep first card non-vote so the first swipe is instant
    const firstNonVote = picked.findIndex(c => c.cardType !== "vote");
    if(firstNonVote > 0){ const c = picked.splice(firstNonVote,1)[0]; picked.unshift(c); }
  } else if(m === "couple"){
    let choices = inDeck.filter(c => c.cardType === "choice");
    if(choices.length < ROUND_SIZE) choices = choices.concat(CARDS.filter(c => c.cardType === "choice" && c.deck === "couple"), CARDS.filter(c => c.cardType === "choice" && c.deck === "warm_up"));
    const dup = new Set(); choices = choices.filter(c => !dup.has(c.id) && dup.add(c.id));
    picked = takeFresh(choices, ROUND_SIZE, deck + ":choice");
  } else {
    picked = takeFresh(inDeck.filter(c => c.cardType !== "vote"), ROUND_SIZE, deck + ":solo");
  }
  saveSeen();
  state.round = picked; state.idx = 0; state.votes = {}; state.picks = {}; state.soloPicks = {}; state.abVotes = {}; state.usedPenalties = new Set(); state.sent = {};
  fetchStats();
}

/* ===================== helpers ===================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
function haptic(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
function applyAccent(){ const d = DECK[state.deckId]; document.documentElement.style.setProperty("--accent", d.accent); document.documentElement.style.setProperty("--ink", d.ink); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0d10"); }
function splitChoice(card){ const s = L(card); const parts = s.replace(/[?？]\s*$/,"").split(/\s+vs\s+|\s+or\s+/i); return parts.length === 2 ? parts.map(p => p.trim()) : null; }
function kickerFor(card){
  const s = t();
  if(card.cardType === "vote") return s.voteKicker;
  if(card.cardType === "choice") return s.choiceKicker;
  if(card.cardType === "story") return s.storyKicker;
  if(card.cardType === "deep_light") return s.deepKicker;
  return s.answerKicker;
}
const ICON = {
  close:'<path d="M6 6l12 12M18 6L6 18"/>', menu:'<path d="M4 7h16M4 12h10M4 17h16"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>', share:'<path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 15V3M7 8l5-5 5 5"/>'
};
const ic = (n,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
function toast(msg){ const el = document.createElement("div"); el.className="toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 1600); }

/* ===================== screens ===================== */
function render(){
  applyAccent();
  if(state.screen === "result") return renderResult();
  renderCard();
}

function topBar(){
  const s = t(); const d = DECK[state.deckId];
  return `<div class="top">
    <button class="icon-btn" id="btnAgain" aria-label="${esc(s.again)}">${ic("close")}</button>
    <div><button class="chip" id="btnDeck" aria-label="${esc(s.deckLabel)}">${esc(L({ko:d.ko,en:d.en}))}<span class="n">▾</span></button><span class="prog">${state.idx+1} / ${state.round.length}</span></div>
    <button class="icon-btn" id="btnMenu" aria-label="${esc(s.menuTitle)}">${ic("menu")}</button>
  </div>`;
}

function renderCard(){
  const s = t();
  const card = state.round[state.idx];
  const m = mode();
  const isVote = card.cardType === "vote" && m === "group";
  const isChoice = card.cardType === "choice";
  const ab = isChoice ? splitChoice(card) : null;

  let kicker = kickerFor(card), foot = "", body = "";
  if(isVote){ body = `<div class="foot row"><span id="voteFoot">${esc(voteCta(card.id))}</span><button class="inl" id="btnPenalty" aria-label="${esc(s.roulette)}" ${topVoted(card.id)?"":"disabled"}>${esc(s.penaltyBtn)}</button></div>`; }
  else if(isChoice && ab){
    // long options stack vertically so both buttons stay the same height
    const abCls = "ab" + (Math.max(ab[0].length, ab[1].length) > (state.lang==="ko" ? 8 : 16) ? " col" : "");
    if(m === "couple"){
      const p = state.picks[card.id] || [];
      const who = state.players[p.length] || (state.lang==="ko"?"둘째":"Second");
      const done = p.length >= 2;
      kicker = s.choiceKicker + " · " + (done ? (p[0] === p[1] ? s.sameAnswer : s.diffAnswer) : p.length === 0 ? s.firstPick(state.players[0]||"A") : s.turnOf(who));
      const nm = i => p.map((c,idx) => c === i ? (state.players[idx] || (idx ? "B" : "A")) : null).filter(Boolean);
      body = `<div class="${abCls}">${ab.map((x,i)=>`<button data-c="${i}" class="${done && p.includes(i)?"on":""}${done && nm(i).length?" who":""}"><span>${esc(x)}</span>${done && nm(i).length?`<small>${esc(nm(i).join(" · "))}</small>`:""}</button>`).join("")}</div>`
        + (done ? `<div class="foot" id="statsLine">${esc(statsLine(card))}</div>` : "");
    } else if(m === "group"){
      // one phone, many people: everyone shouts at three, the holder taps each side once per hand
      kicker = s.choiceKicker + " · " + s.choiceGroupHint;
      const v = state.abVotes[card.id] || [0,0]; const top = Math.max(v[0], v[1]);
      body = `<div class="${abCls}">${ab.map((x,i)=>`<button data-c="${i}" class="${v[i]>0&&v[i]===top?"on":""}"><span>${esc(x)}</span><small>${v[i]}</small></button>`).join("")}</div>
        <div class="foot row"><span id="statsLine">${esc(statsLine(card) || s.choiceGroupFoot)}</span><button class="inl" id="btnPenalty" aria-label="${esc(s.roulette)}" ${v[0]>0&&v[1]>0&&v[0]!==v[1]?"":"disabled"}>${esc(s.penaltyBtn)}</button></div>`;
    } else {
      kicker = s.choiceKicker + " · " + s.choiceHint;
      const on = state.soloPicks[card.id];
      body = `<div class="${abCls}">${ab.map((x,i)=>`<button data-c="${i}" class="${on===i?"on":""}">${esc(x)}</button>`).join("")}</div>`
        + (on !== undefined ? `<div class="foot" id="statsLine">${esc(statsLine(card))}</div>` : "");
    }
  } else {
    if(m === "group" && card.cardType !== "choice"){ const who = state.players[state.idx % state.players.length]; kicker += " · " + s.turnOf(who); }
    const pen = card.penalty || !!DECK[card.deck].passPenalty;   // deck rule (spicy) or per-card flag
    foot = card.follow ? L(card.follow) : pen ? s.passPenalty : card.cardType === "story" ? s.footStory : card.cardType === "deep_light" ? s.footDeep : s.footAnswer;
    if(pen) body = `<div class="foot row"><span>${esc(foot)}</span><button class="inl" id="btnPenalty" aria-label="${esc(s.roulette)}">${esc(s.penaltyBtn)}</button></div>`;
  }

  let voteGrid = "";
  if(isVote){
    const v = state.votes[card.id] || {};
    const n = state.players.length;
    voteGrid = `<div class="names ${n>4?"three":""}" role="group" aria-label="${esc(s.voteKicker)}">${state.players.map(p => `<button class="name ${v[p]?"on":""}" data-n="${esc(p)}"><span>${esc(p)}</span><small>${v[p]||0}${state.lang==="ko"?"표":""}</small></button>`).join("")}</div>`;
  }

  const bottom = `<button class="hint" id="btnNext" aria-label="${esc(s.nextBtn)}">${ic("up",22)}<span>${esc(s.next)}</span></button>`;

  app.classList.toggle("votemode", isVote);
  app.innerHTML = topBar() + `
    <div class="stage ${isVote?"vote":""}">
      <div class="stack">
        <div class="card back2" aria-hidden="true"></div>
        <div class="card back1" aria-hidden="true"></div>
        <div class="card enter" id="card">
          <div class="kicker">${esc(kicker)}</div>
          <div class="q">${esc(L(card))}</div>
          ${body || `<div class="foot">${esc(foot)}</div>`}
        </div>
      </div>
    </div>
    ${voteGrid}
    <div class="bottom">${bottom}</div>`;

  bindTop();
  const cardEl = document.getElementById("card");
  attachSwipe(cardEl, () => next());
  document.getElementById("btnNext").onclick = () => next();
  const bp = document.getElementById("btnPenalty"); if(bp) bp.onclick = () => { haptic(8); openRoulette(topVoted(card.id)); };
  app.querySelectorAll(".name").forEach(b => b.onclick = () => { haptic(8); vote(card.id, b.dataset.n); });
  app.querySelectorAll(".ab button").forEach(b => b.onclick = () => { haptic(8); pick(card, +b.dataset.c); });
}

function bindTop(){
  document.getElementById("btnAgain").onclick = () => { haptic(8); showInterstitial("again", () => { buildRound(); state.screen="card"; render(); }); };
  document.getElementById("btnMenu").onclick = () => openMenu();
  const bd = document.getElementById("btnDeck"); if(bd) bd.onclick = () => openMenu();
}

function voteLead(cardId){
  // best = single top-voted name, null when nobody voted or when the top is shared (tie)
  const v = state.votes[cardId] || {}; let best = null, n = 0, tie = false;
  for(const k in v){ if(v[k] > n){ n = v[k]; best = k; tie = false; } else if(v[k] === n && n > 0) tie = true; }
  return { best: tie ? null : best, tie };
}
function topVoted(cardId){ return voteLead(cardId).best; }
function voteCta(cardId){ const s = t(); const l = voteLead(cardId); return l.tie ? s.voteTie : s.voteNext(l.best); }
function vote(cardId, name){
  const v = state.votes[cardId] = state.votes[cardId] || {};
  const max = state.players.length;
  v[name] = ((v[name]||0) + 1) % (max + 1);
  if(v[name] === 0) delete v[name];
  // rerender only the grid + cta to keep the card still
  const card = state.round[state.idx];
  app.querySelectorAll(".name").forEach(b => { const c = v[b.dataset.n]||0; b.classList.toggle("on", c>0); b.querySelector("small").textContent = c + (state.lang==="ko"?"표":""); });
  const lead = topVoted(card.id);
  const vf = document.getElementById("voteFoot"); if(vf) vf.textContent = voteCta(card.id);
  const bp = document.getElementById("btnPenalty"); if(bp) bp.disabled = !lead;
}
function pick(card, i){
  if(mode() === "couple"){
    const p = state.picks[card.id] = state.picks[card.id] || [];
    if(p.length >= 2) return;
    p.push(i);
    if(p.length >= 2) sendVote(card);
    renderCard();
  } else if(mode() === "group"){
    const v = state.abVotes[card.id] = state.abVotes[card.id] || [0,0];
    v[i] = (v[i] + 1) % (state.players.length + 1);          // tap past the head count to reset that side
    const top = Math.max(v[0], v[1]);
    app.querySelectorAll(".ab button").forEach(b => { const k = +b.dataset.c; b.classList.toggle("on", v[k] > 0 && v[k] === top); b.querySelector("small").textContent = v[k]; });
    const bp = document.getElementById("btnPenalty"); if(bp) bp.disabled = !(v[0] > 0 && v[1] > 0 && v[0] !== v[1]);
    const sl = document.getElementById("statsLine"); if(sl) sl.textContent = statsLine(card) || t().choiceGroupFoot;
  } else {
    state.soloPicks[card.id] = i; renderCard();
  }
}
function next(){
  const card = state.round[state.idx];
  if(card && card.cardType === "choice") sendVote(card);
  // a group round needs names before the first vote card
  const upcoming = state.round[state.idx+1];
  if(state.idx + 1 >= state.round.length){ state.screen = "result"; leave(() => render()); return; }
  if(upcoming && upcoming.cardType === "vote" && state.players.length < 3 && mode() !== "couple"){
    // group deck but no names yet: ask now, then continue
    if(!state.namesAsked){ openNames(() => { state.idx++; render(); }); return; }
    // still fewer than 3 names → skip vote cards entirely
    state.round.splice(state.idx+1, 1); return next();
  }
  state.idx++; leave(() => render());
}
function leave(cb){
  const el = document.getElementById("card");
  if(!el || matchMedia("(prefers-reduced-motion: reduce)").matches){ cb(); return; }
  el.classList.add("leaving"); setTimeout(cb, 240);
}

/* swipe up = next */
function attachSwipe(el, onUp){
  let y0 = null, x0 = null, dragging = false;
  el.addEventListener("pointerdown", e => { if(e.target.closest("button")) return; y0 = e.clientY; x0 = e.clientX; dragging = true; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => { if(!dragging) return; const dy = e.clientY - y0; if(dy < 0){ el.style.transform = `translateY(${dy*0.9}px) rotate(${dy/60}deg)`; } });
  const end = e => { if(!dragging) return; dragging = false; const dy = e.clientY - y0; el.style.transform = ""; if(dy < -80){ haptic(10); onUp(); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("click", e => { if(e.target.closest("button")) return; /* tap does nothing: swipe or use the button */ });
}

/* ===================== national stats (worker/) ===================== */
function fetchStats(){
  if(!STATS_API) return;
  const ids = state.round.filter(c => c.cardType === "choice").map(c => c.id);
  if(!ids.length) return;
  fetch(`${STATS_API}/stats?cards=${ids.join(",")}`, { cache:"no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if(!d) return; for(const id in d){ if(!(state.stats[id] && state.stats[id].mine)) state.stats[id] = d[id]; }
      const cur = state.round[state.idx]; const sl = document.getElementById("statsLine");
      if(sl && cur && cur.cardType === "choice") sl.textContent = statsLine(cur) || t().choiceGroupFoot; })
    .catch(() => {});
}
// this phone's answer as [a,b]: hands per side (group), both picks (couple), one pick (solo)
function myCounts(card){
  const m = mode();
  if(m === "group"){ const v = state.abVotes[card.id]; return v && (v[0] || v[1]) ? v : null; }
  if(m === "couple"){ const p = state.picks[card.id]; return p && p.length === 2 ? [p.filter(x => x === 0).length, p.filter(x => x === 1).length] : null; }
  const i = state.soloPicks[card.id]; return i === undefined ? null : (i === 0 ? [1,0] : [0,1]);
}
function sendVote(card){
  if(!STATS_API || state.sent[card.id]) return;
  const c = myCounts(card); if(!c) return;
  state.sent[card.id] = true;
  fetch(`${STATS_API}/vote`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ card: card.id, a: c[0], b: c[1] }), keepalive:true })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if(d && d.card){ d.mine = true; state.stats[d.card] = d; const sl = document.getElementById("statsLine"); if(sl && state.round[state.idx] === card) sl.textContent = statsLine(card); } })
    .catch(() => {});
}
// "전국 62% vs 38% · 1,204명" — includes this phone's answer even before the server confirms it
function statsLine(card){
  const c = myCounts(card); if(!c) return "";
  const st = state.stats[card.id] || { a:0, b:0 };
  const a = st.a + (st.mine ? 0 : c[0]), b = st.b + (st.mine ? 0 : c[1]), n = a + b;
  if(!st.mine && st.a + st.b === 0) return t().statsFirst;
  const pa = Math.round(a / n * 100);
  return t().statsLine(pa, 100 - pa, n.toLocaleString());
}

/* ===================== result ===================== */
function computeGroupResult(){
  // per player: votes per trait, total votes
  const score = {}; const total = {};
  state.players.forEach(p => { score[p] = {}; total[p] = 0; });
  let votesCast = 0;
  state.round.forEach(c => {
    if(c.cardType !== "vote") return;
    const v = state.votes[c.id] || {};
    for(const name in v){ if(!score[name]) continue; score[name][c.trait] = (score[name][c.trait]||0) + v[name]; total[name] += v[name]; votesCast += v[name]; }
  });
  // assign distinct traits greedily: highest (player,trait) pair first
  const pairs = [];
  for(const p of state.players) for(const tr in score[p]) pairs.push({p, tr, n: score[p][tr]});
  pairs.sort((a,b) => b.n - a.n || b.p.localeCompare(a.p));
  const assigned = {}; const usedTrait = new Set();
  for(const {p,tr} of pairs){ if(assigned[p] || usedTrait.has(tr)) continue; assigned[p] = tr; usedTrait.add(tr); }
  // players with no votes get a leftover trait, lowest first
  const leftovers = Object.keys(TRAITS).filter(k => !usedTrait.has(k));
  state.players.forEach(p => { if(!assigned[p]) assigned[p] = leftovers.shift() || "chaos"; });
  const ranked = state.players.slice().sort((a,b) => total[b]-total[a]);
  return { assigned, total, ranked, votesCast, winner: ranked[0] };
}
function computeCoupleResult(){
  let same = 0, n = 0, split = null;
  state.round.forEach(c => { const p = state.picks[c.id]; if(!p || p.length < 2) return; n++; if(p[0] === p[1]) same++; else if(!split) split = c; });
  const pct = n ? Math.round(same / n * 100) : 0;
  return { same, n, pct, split };
}
function dateStr(){ const d = new Date(); return state.lang==="ko" ? `${d.getMonth()+1}월 ${d.getDate()}일` : d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }

function renderResult(){
  const s = t();
  let m = mode();
  if(m === "group" && computeGroupResult().votesCast === 0) m = "solo";   // nobody voted (vote cards skipped or untouched): no titles to hand out
  let inner = "";
  if(m === "group"){
    const r = computeGroupResult();
    const w = r.winner; const wt = TRAITS[r.assigned[w]];
    const wv = r.total[w];
    const verdict = wv > 0 && wv >= r.votesCast * 0.6 ? s.nearUnan : (wv > 0 ? s.votesOf(wv, r.votesCast) : s.tight);
    inner = `
      <div><div class="meta">${esc(dateStr())} · ${esc(s.people(state.players.length))}</div><div class="title">${esc(L({ko:wt.ko,en:wt.en}))}</div></div>
      <div class="charslot" aria-hidden="true"></div>
      <div><div class="who">${esc(w)}</div><div class="sub">${esc(verdict)} · ${esc(L({ko:wt.sub_ko,en:wt.sub_en}))}</div></div>
      <div class="list">${r.ranked.slice(1).map(p => `<div><span>${esc(L({ko:TRAITS[r.assigned[p]].ko,en:TRAITS[r.assigned[p]].en}))}</span><span>${esc(p)}</span></div>`).join("")}</div>
      <div class="brand"><span>talkflip</span><span>${esc(s.playAgainCta)}</span></div>`;
    state._result = { kind:"group", r };
  } else if(m === "couple"){
    const r = computeCoupleResult();
    const names = state.players.length === 2 ? state.players.join(" & ") : "";
    inner = `
      <div><div class="meta">${esc(dateStr())}${names?" · "+esc(names):""}</div><div class="title" style="font-size:40px">${esc(s.chem)}</div></div>
      <div class="pct">${r.pct}<span>%</span></div>
      <div class="list">
        <div><span>${esc(s.chemSame(r.same, r.n))}</span><span>${r.same}</span></div>
        <div><span>${esc(s.chemSplit)}</span><span>${r.split ? esc(L(r.split).replace(/[?？]$/,"")) : "—"}</span></div>
        <div><span>${esc(s.chemUs)}</span><span>${esc(s.chemLabel(r.pct))}</span></div>
      </div>
      <div class="brand"><span>talkflip</span><span>${esc(s.playAgainCta)}</span></div>`;
    state._result = { kind:"couple", r };
  } else {
    const d = DECK[state.deckId];
    inner = `
      <div><div class="meta">${esc(dateStr())} · ${esc(L({ko:d.ko,en:d.en}))}</div><div class="title">${esc(s.soloTitle)}</div></div>
      <div><div class="sub" style="font-size:16px">${esc(s.soloSub)}</div></div>
      <div class="list">${state.round.slice(0,3).map(c => `<div><span>${esc(L(c))}</span></div>`).join("")}</div>
      <div class="brand"><span>talkflip</span><span>${esc(s.playAgainCta)}</span></div>`;
    state._result = { kind:"solo" };
  }
  app.classList.remove("votemode");
  app.innerHTML = `<div class="top"><span class="prog" style="margin:0">${esc(s.resultTitle)}</span><button class="icon-btn" id="btnMenu" aria-label="${esc(s.menuTitle)}">${ic("menu")}</button></div>
    <div class="result"><div class="rcard" id="rcard">${inner}</div></div>
    <div class="bottom">
      <button class="cta" id="btnShare">${ic("share")}${esc(s.share)}</button>
      <button class="cta ghost" id="btnAgain">${esc(s.again)}</button>
    </div>`;
  document.getElementById("btnMenu").onclick = () => openMenu();
  document.getElementById("btnAgain").onclick = () => { haptic(8); showInterstitial("again", () => { buildRound(); state.screen="card"; render(); }); };
  document.getElementById("btnShare").onclick = () => shareResult();
}

/* ===================== share image ===================== */
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(ctx, text, maxW){ const out=[]; let line=""; for(const ch of String(text)){ if(ctx.measureText(line+ch).width > maxW && line){ out.push(line); line = ch === " " ? "" : ch; } else line += ch; } if(line) out.push(line); return out; }
async function makeResultCanvas(){
  const s = t(); const d = DECK[state.deckId];
  // Google Fonts splits Korean into ~100 unicode-range subsets that load lazily. Ask for the exact glyphs we are about
  // to draw (everything on the result card + footer), otherwise the canvas falls back mid-word (e.g. "인" bold, "간 변수" not).
  try {
    const glyphs = (document.getElementById("rcard")?.textContent || "") + SHARE_URL + dateStr() + s.playAgainCta;
    await Promise.all([document.fonts.load("900 80px 'Noto Sans KR'", glyphs), document.fonts.load("700 40px 'Noto Sans KR'", glyphs), document.fonts.load("400 120px 'Black Han Sans'", glyphs)]);
    await document.fonts.ready;
  } catch(e){}
  const W=1080, H=1600, P=84;
  const cv = document.createElement("canvas"); cv.width=W; cv.height=H; const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0d0d10"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = d.accent; roundRect(ctx, 60, 120, W-120, H-240, 64); ctx.fill();
  ctx.fillStyle = d.ink; ctx.textBaseline = "top";
  const R = state._result;
  let y = 200;
  const text = (str, font, x, yy, alpha=1) => { ctx.globalAlpha = alpha; ctx.font = font; ctx.fillText(str, x, yy); ctx.globalAlpha = 1; };
  if(R.kind === "group"){
    const r = R.r; const w = r.winner; const wt = TRAITS[r.assigned[w]];
    text(`${dateStr()} · ${s.people(state.players.length)}`, "700 30px 'Noto Sans KR'", P+40, y, .7); y += 70;
    const title = L({ko:wt.ko,en:wt.en}); ctx.font = "400 150px 'Black Han Sans','Noto Sans KR'";
    for(const ln of wrap(ctx, title, W-2*P-80)){ ctx.fillText(ln, P+40, y); y += 150; }
    y += 60;
    text(w, "900 120px 'Noto Sans KR'", P+40, y); y += 140;
    text(L({ko:wt.sub_ko,en:wt.sub_en}), "700 38px 'Noto Sans KR'", P+40, y, .75); y += 90;
    ctx.globalAlpha = .18; ctx.fillRect(P+40, y, W-2*P-80, 4); ctx.globalAlpha = 1; y += 40;
    ctx.font = "700 40px 'Noto Sans KR'";
    r.ranked.slice(1, 5).forEach(p => { const tr = TRAITS[r.assigned[p]]; ctx.fillText(L({ko:tr.ko,en:tr.en}), P+40, y); const pn = p; ctx.fillText(pn, W-P-40-ctx.measureText(pn).width, y); y += 66; });
  } else if(R.kind === "couple"){
    const r = R.r; const names = state.players.length === 2 ? " · " + state.players.join(" & ") : "";
    text(dateStr() + names, "700 30px 'Noto Sans KR'", P+40, y, .7); y += 70;
    text(s.chem, "400 110px 'Black Han Sans','Noto Sans KR'", P+40, y); y += 170;
    ctx.font = "400 340px 'Black Han Sans','Noto Sans KR'"; ctx.fillText(String(r.pct), P+40, y);
    const pw = ctx.measureText(String(r.pct)).width; ctx.font = "400 120px 'Black Han Sans','Noto Sans KR'"; ctx.fillText("%", P+50+pw, y+200); y += 400;
    ctx.globalAlpha = .18; ctx.fillRect(P+40, y, W-2*P-80, 4); ctx.globalAlpha = 1; y += 40;
    ctx.font = "700 40px 'Noto Sans KR'";
    const rows = [[s.chemSame(r.same,r.n), String(r.same)],[s.chemSplit, r.split ? L(r.split).replace(/[?？]$/,"") : "—"],[s.chemUs, s.chemLabel(r.pct)]];
    rows.forEach(([a,b]) => { ctx.fillText(a, P+40, y); const bw = Math.min(ctx.measureText(b).width, 520); ctx.fillText(b, W-P-40-bw, y, 520); y += 66; });
  } else {
    text(`${dateStr()} · ${L({ko:d.ko,en:d.en})}`, "700 30px 'Noto Sans KR'", P+40, y, .7); y += 70;
    text(s.soloTitle, "400 150px 'Black Han Sans','Noto Sans KR'", P+40, y); y += 220;
    ctx.font = "700 40px 'Noto Sans KR'";
    state.round.slice(0,4).forEach(c => { for(const ln of wrap(ctx, L(c), W-2*P-80).slice(0,2)){ ctx.fillText(ln, P+40, y); y += 54; } y += 20; });
  }
  // footer
  ctx.font = "700 32px 'Noto Sans KR'"; ctx.globalAlpha = .6;
  ctx.fillText("talkflip", P+40, H-120-100);
  const cta = s.playAgainCta; ctx.fillText(cta, W-P-40-ctx.measureText(cta).width, H-120-100);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#f4f4f2"; ctx.font = "700 30px 'Noto Sans KR'"; ctx.globalAlpha = .6;
  ctx.fillText(SHARE_URL, W/2 - ctx.measureText(SHARE_URL).width/2, H-84); ctx.globalAlpha = 1;
  return cv;
}
async function shareResult(){
  haptic(8);
  const cv = await makeResultCanvas();
  const url = cv.toDataURL("image/png"); const s = t();
  const overlay = document.createElement("div"); overlay.className = "modal-bg";
  overlay.innerHTML = `<div class="modal"><img src="${url}" alt="${esc(s.resultTitle)}"/>
    <button class="cta" id="shSys">${ic("share")}${esc(s.share)}</button>
    <button class="cta ghost" id="shDl">${esc(s.saveImg)}</button></div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
  overlay.querySelector("#shDl").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = "talkflip.png"; a.click(); };
  overlay.querySelector("#shSys").onclick = async () => {
    try {
      const blob = await (await fetch(url)).blob();
      const file = new File([blob], "talkflip.png", {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], text:"#TalkFlip " + SHARE_URL});
      else if(navigator.share) await navigator.share({text:"#TalkFlip " + SHARE_URL, url:"https://" + SHARE_URL});
      else toast(s.shareFail);
    } catch(e){}
  };
}

/* ===================== sheets ===================== */
function sheet(html){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target === bg) bg.remove(); });
  return bg;
}
function openNames(onDone){
  const s = t(); state.namesAsked = true;
  const couple = DECK[state.deckId].players === 2;
  const bg = sheet(`<h2>${esc(s.namesTitle)}</h2><p>${esc(couple ? s.namesDescCouple : s.namesDesc)}</p><div id="nameList"></div>
    <div class="field"><input id="nameIn" placeholder="${esc(s.namePh)}" maxlength="8" autocomplete="off" enterkeyhint="done"><button id="nameAdd" aria-label="${esc(s.addName)}">+</button></div>
    <button class="cta" id="nameGo" style="margin-top:8px">${esc(s.startVote)}</button>`);
  const list = bg.querySelector("#nameList"); const inp = bg.querySelector("#nameIn");
  const draw = () => { list.innerHTML = state.players.map((p,i)=>`<div class="field"><input value="${esc(p)}" data-i="${i}" maxlength="8"><button data-del="${i}" aria-label="−">−</button></div>`).join("");
    list.querySelectorAll("input").forEach(el => el.onchange = () => { state.players[+el.dataset.i] = el.value.trim() || state.players[+el.dataset.i]; save(); });
    list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { state.players.splice(+b.dataset.del,1); save(); draw(); }); };
  const add = () => { const v = inp.value.trim(); if(!v || state.players.includes(v) || state.players.length >= 8) return; state.players.push(v); inp.value=""; save(); draw(); inp.focus(); };
  bg.querySelector("#nameAdd").onclick = add;
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } });
  bg.querySelector("#nameGo").onclick = () => { add(); if(couple ? state.players.length < 2 : (state.players.length < 3 && mode() !== "couple")){ toast(couple ? s.minNamesCouple : s.minNames); return; } bg.remove(); if(onDone) onDone(); else { buildRound(); render(); } };
  draw(); setTimeout(() => inp.focus(), 50);
}
// "본문 (보충)" → main line + smaller note line, so a parenthetical never breaks mid-way
function penaltyHtml(txt){ const m = String(txt).match(/^(.*?)\s*[（(](.+?)[)）]\s*$/); return m ? `${esc(m[1])}<small>${esc(m[2])}</small>` : esc(txt); }
function openRoulette(name){
  const s = t();
  if(!PENALTIES.length) return;
  const bg = sheet(`<h2>${esc(name ? s.rouletteFor(name) : s.roulette)}</h2><p>${esc(s.rouletteSub)}</p>
    <div class="roul" id="roul" aria-live="polite">${esc(s.rouletteReady)}</div>
    <button class="cta" id="spin">${esc(s.spin)}</button>
    <button class="cta ghost" id="rclose">${esc(s.close)}</button>`);
  const box = bg.querySelector("#roul"), btn = bg.querySelector("#spin");
  bg.querySelector("#rclose").onclick = () => bg.remove();
  let last = -1, timer = null;
  const pickIdx = () => {
    const used = state.usedPenalties || (state.usedPenalties = new Set());
    if(used.size >= PENALTIES.length) used.clear();                 // every penalty seen this round: start over
    let pool = PENALTIES.map((_, i) => i).filter(i => !used.has(i) && i !== last);
    if(!pool.length) pool = PENALTIES.map((_, i) => i).filter(i => i !== last);
    const i = pool[Math.floor(Math.random() * pool.length)]; used.add(i); return i;
  };
  const spin = () => {
    if(timer) return;
    btn.disabled = true; box.classList.remove("hit"); box.classList.add("spin");
    const target = pickIdx(); last = target;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const ticks = reduced ? 1 : 18; let k = 0;
    const step = () => {
      k++;
      const i = k >= ticks ? target : Math.floor(Math.random() * PENALTIES.length);
      box.innerHTML = penaltyHtml(L(PENALTIES[i]));
      if(k >= ticks){ timer = null; box.classList.remove("spin"); box.classList.add("hit"); haptic([20,40,30]); btn.disabled = false; btn.textContent = s.spinAgain; return; }
      haptic(4);
      timer = setTimeout(step, 40 + Math.pow(k / ticks, 2.2) * 260);
    };
    step();
  };
  btn.onclick = spin;
  spin();
}
function openMenu(){
  const s = t();
  const bg = sheet(`<h2>${esc(s.menuTitle)}</h2>
    <label>${esc(s.deckLabel)}</label>
    <div class="decks">${DECKS.map(d => `<button class="deck ${d.id===state.deckId?"on":""}" data-d="${d.id}"><i style="background:${d.accent}"></i>${esc(L({ko:d.ko,en:d.en}))}${d.players?` <small style="color:var(--muted)">2</small>`:""}</button>`).join("")}</div>
    <label>${esc(s.playersLabel)}</label>
    <div class="row"><button class="seg" id="mNames">${state.players.length ? esc(state.players.join(", ")) : esc(s.namesTitle)}</button><button class="seg" id="mReset" style="flex:0 0 auto;padding:0 16px">${esc(s.reset)}</button></div>
    <label>${esc(s.langLabel)}</label>
    <div class="row"><button class="seg ${state.lang==="ko"?"on":""}" data-l="ko">한국어</button><button class="seg ${state.lang==="en"?"on":""}" data-l="en">English</button></div>
    <label>${esc(s.roulette)}</label>
    <div class="row"><button class="seg" id="mRoulette">${esc(s.spin)}</button></div>
    <div class="links"><a href="about.html">${esc(s.about)}</a><a href="guides.html">${esc(s.guides)}</a><a href="penalty.html">${esc(s.penaltyPage)}</a><a href="privacy.html">${esc(s.privacy)}</a><a href="terms.html">${esc(s.terms)}</a></div>`);
  bg.querySelector("#mRoulette").onclick = () => { bg.remove(); openRoulette(null); };
  bg.querySelectorAll(".deck").forEach(b => b.onclick = () => { state.deckId = b.dataset.d; save(); bg.remove(); buildRound(); state.screen="card"; render(); });
  bg.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { state.lang = b.dataset.l; save(); bg.remove(); render(); });
  bg.querySelector("#mNames").onclick = () => { bg.remove(); openNames(() => { buildRound(); state.screen="card"; render(); }); };
  bg.querySelector("#mReset").onclick = () => { state.players = []; save(); bg.remove(); buildRound(); state.screen="card"; render(); };
}

/* ===================== ads (AdSense H5 Games Ads) ===================== */
let _adsReady = false, _lastInterstitial = 0;
function initAds(){
  if(!ADSENSE_CLIENT || ADSENSE_CLIENT.indexOf("ca-pub-") !== 0) return;
  try { window.adsbygoogle = window.adsbygoogle || []; window.adsbygoogle.push({ preloadAdBreaks: "on" }); _adsReady = true; } catch(e){ _adsReady = false; }
}
function _adBreak(o){ try { (window.adsbygoogle = window.adsbygoogle || []).push(o); } catch(e){ if(o.afterAd) o.afterAd(); } }
function showInterstitial(name, done){
  done = done || function(){};
  const now = Date.now();
  if(!_adsReady || now - _lastInterstitial < INTERSTITIAL_COOLDOWN_MS){ done(); return; }
  _lastInterstitial = now;
  _adBreak({ type:"next", name:name||"interstitial", afterAd: done });
}

/* ===================== boot ===================== */
document.documentElement.lang = state.lang;
save(); // persists a deck chosen via ?deck=
buildRound();
render();
// first visit only: point at the deck chip and the menu, gone on the first touch or after 5s
try {
  if(!localStorage.getItem(KEY.hinted)){
    localStorage.setItem(KEY.hinted, "1");
    const c = document.createElement("div"); c.className = "coach"; c.textContent = t().coach; document.body.appendChild(c);
    const off = () => { c.remove(); document.removeEventListener("pointerdown", off); };
    setTimeout(() => document.addEventListener("pointerdown", off, { once:true }), 400);
    setTimeout(off, 5000);
  }
} catch(e){}
// ?roulette (from penalty.html): open the wheel over the first card
try { if(new URLSearchParams(location.search).has("roulette")){ history.replaceState(null, "", location.pathname); openRoulette(null); } } catch(e){}
initAds();
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  // a new build activated (cache name changed): swap to it right away if the round hasn't started, otherwise on the next visit
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadController){ hadController = true; return; }          // first install, nothing to refresh
    const idle = state.screen === "card" && state.idx === 0 && !Object.keys(state.votes).length && !Object.keys(state.abVotes).length && !document.querySelector(".sheet-bg");
    if(idle) location.reload();
  });
}
